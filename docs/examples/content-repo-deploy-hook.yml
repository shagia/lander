# Copy into the *content* repository as:
#   .github/workflows/vercel-deploy-hook.yml
#
# Triggers a rebuild of the Vercel *site* project whenever content is pushed
# (including Keystatic saves in GitHub mode).
#
# Setup:
# 1. In the Vercel site project: Settings → Git → Deploy Hooks → Create Hook
#    (branch: your production branch, e.g. main).
# 2. In the content repo: Settings → Secrets → Actions → New repository secret
#    Name: VERCEL_DEPLOY_HOOK_URL
#    Value: the Deploy Hook URL from step 1
# 3. Optional: append ?buildCache=false to the hook URL if content-only
#    deploys ever look stale.

name: Trigger site deploy

on:
  push:
    branches:
      - main

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: POST Vercel Deploy Hook
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK_URL" ]; then
            echo "VERCEL_DEPLOY_HOOK_URL secret is not set" >&2
            exit 1
          fi
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
